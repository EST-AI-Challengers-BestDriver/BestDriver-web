services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    networks:
      bestdriver:
        aliases: [web]

networks:
  bestdriver:
    name: bestdriver
    external: true
