services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    environment:
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=2).read()
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      bestdriver:
        aliases: [web]

networks:
  bestdriver:
    name: bestdriver
    external: true
