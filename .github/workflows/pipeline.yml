name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to EC2
    if: github.event_name != 'pull_request' && vars.EC2_CD_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
      WEB_IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT || '3000' }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Configure SSH
        shell: bash
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_ec2
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ec2 ~/.ssh/known_hosts

      - name: Check EC2 SSH port
        shell: bash
        run: |
          echo "Checking EC2 port 22..."
          if timeout 10 bash -c "</dev/tcp/$EC2_HOST/22"; then
            echo "EC2 port 22 is reachable"
          else
            echo "EC2 port 22 is NOT reachable"
            exit 1
          fi

      - name: Upload deployment definition
        shell: bash
        run: |
          printf 'WEB_IMAGE=%s\nWEB_HOST_PORT=%s\n' "$WEB_IMAGE" "$WEB_HOST_PORT" > web.deploy.env
          ssh -i ~/.ssh/id_ec2 "$EC2_USER@$EC2_HOST" "mkdir -p ~/bestdriver"
          scp -i ~/.ssh/id_ec2 deploy/compose.yml "$EC2_USER@$EC2_HOST:bestdriver/web.compose.yml"
          scp -i ~/.ssh/id_ec2 web.deploy.env "$EC2_USER@$EC2_HOST:bestdriver/web.deploy.env"

      - name: Authenticate EC2 to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/id_ec2 "$EC2_USER@$EC2_HOST" \
            "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy web service
        shell: bash
        run: |
          ssh -i ~/.ssh/id_ec2 "$EC2_USER@$EC2_HOST" \
            "docker network inspect bestdriver >/dev/null 2>&1 || docker network create bestdriver; \
             cd ~/bestdriver && \
             docker compose --env-file web.deploy.env -p bestdriver-web -f web.compose.yml up -d --pull always --wait --wait-timeout 90"
