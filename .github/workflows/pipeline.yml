name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ecoroute-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and smoke-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q src *.py

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.py; do
            python "$test_file"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build deployment image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ecoroute-ci:${{ github.sha }}
          cache-from: type=gha,scope=ecoroute
          cache-to: type=gha,mode=max,scope=ecoroute

      - name: Smoke-check deployment image
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name ecoroute-ci --publish 3000:3000 "ecoroute-ci:${GITHUB_SHA}"
          trap 'docker logs ecoroute-ci; docker rm --force ecoroute-ci >/dev/null 2>&1 || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' ecoroute-ci)" != "true" ]]; then
              exit 1
            fi
            if [[ "$attempt" == "60" ]]; then
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/ | grep -q '<title>EcoRoute'
          curl --fail --silent http://127.0.0.1:3000/api/config \
            | python -c 'import json,sys; data=json.load(sys.stdin); assert data["selectable_node_count"] > 0'

  publish:
    name: Build and publish image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ecoroute
          cache-to: type=gha,mode=max,scope=ecoroute

  deploy:
    name: Deploy to EC2
    if: github.event_name != 'pull_request' && vars.EC2_CD_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      WEB_IMAGE: ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.tag }}
      WEB_HOST_PORT: ${{ vars.WEB_HOST_PORT || '3000' }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::020212777377:role/BestDriver-GitHub-Deploy
          aws-region: ap-southeast-2

      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      - name: Deploy web service via SSM
        shell: bash
        env:
          INSTANCE_ID: i-03ce10656dbb5142a
        run: |
          # Compose 파일을 안전하게 명령에 포함시키기 위해 base64로 변환
          COMPOSE_B64="$(base64 -w 0 deploy/compose.yml)"

          # EC2에서 실행할 배포 스크립트 생성
          REMOTE_SCRIPT="$(cat <<EOF
          set -eu

          install -d -m 755 -o ubuntu -g ubuntu /home/ubuntu/bestdriver

          printf '%s' '$COMPOSE_B64' \
            | base64 -d \
            > /home/ubuntu/bestdriver/web.compose.yml

          cat > /home/ubuntu/bestdriver/web.deploy.env <<ENVEOF
          WEB_IMAGE=$WEB_IMAGE
          WEB_HOST_PORT=$WEB_HOST_PORT
          ENVEOF

          chown ubuntu:ubuntu \
            /home/ubuntu/bestdriver/web.compose.yml \
            /home/ubuntu/bestdriver/web.deploy.env

          docker network inspect bestdriver >/dev/null 2>&1 \
            || docker network create bestdriver

          cd /home/ubuntu/bestdriver

          docker compose \
            --env-file web.deploy.env \
            -p bestdriver-web \
            -f web.compose.yml \
            up -d \
            --pull always \
            --wait \
            --wait-timeout 90
          EOF
          )"

          # SSM 명령 전달을 위해 전체 스크립트를 다시 base64로 변환
          SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)"

          jq -n \
            --arg cmd "printf '%s' '$SCRIPT_B64' | base64 -d | bash" \
            '{commands: [$cmd]}' \
            > ssm-params.json

          COMMAND_ID="$(
            aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters file://ssm-params.json \
              --comment "BestDriver web deployment ${GITHUB_SHA}" \
              --query 'Command.CommandId' \
              --output text
          )"

          echo "SSM command ID: $COMMAND_ID"

          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"
          then
            echo "Deployment succeeded."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json
          else
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
              --output json || true

            exit 1
          fi
